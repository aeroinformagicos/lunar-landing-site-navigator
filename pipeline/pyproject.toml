# AI-assisted: written with Claude Code, reviewed by team Aeroinformágicos
[project]
name = "llsn-pipeline"
version = "0.1.0"
description = "Lunar Landing Site Navigator offline pipeline"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
# Run from the repository root: `python -m pytest -c pipeline/pyproject.toml`
testpaths = ["pipeline/tests"]
markers = [
    "kernels: needs the four SPICE kernels in $LLSN_DATA_DIR/kernels",
    "data: needs downloaded DEMs (make test-all)",
    "slow: needs the cube or many masks (overnight)",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E741: `l` (line) and `s` (sample) are the pixel names of the PDS labels and of the specification.
ignore = ["E741"]
